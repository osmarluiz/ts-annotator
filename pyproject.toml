[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-annotator"
version = "0.1.0"
description = "TSA — Time Series Annotator: map-native, active-learning pixel labeling for satellite image time series (gigapixel COG navigation, similarity-assisted, review mode)."
authors = [{ name = "Osmar L. F. de Carvalho", email = "osmarlfcarvalho@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["remote sensing", "annotation", "active learning", "time series", "labeling", "COG"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "pyqtgraph>=0.13",
    "PyQt6>=6.4",
    "qtawesome>=1.3",
    "matplotlib>=3.7",
    "geopandas>=0.13",
    "shapely>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt", "pytest-cov"]
# treino/classificação (a UI roda sem; a aba Train exige)
train = ["torch>=2.0", "scikit-learn>=1.2", "cleanlab>=2.4"]

[project.scripts]
tsa = "ts_annotator.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ts_annotator"]
omit = ["*/app/main.py", "*/app/theme.py"]   # thin CLI entry + static QSS

[tool.coverage.report]
# core (GUI-free domain logic) is the meaningful target; the PyQt map widgets and
# the orchestration controller are exercised via the app, not unit tests.
show_missing = true
